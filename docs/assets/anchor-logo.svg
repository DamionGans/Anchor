<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <radialGradient id="anchorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pendulumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="weightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00E5FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background circular glow -->
  <circle cx="54" cy="54" r="50" fill="url(#anchorGlow)"/>

  <!-- Base Pedestal -->
  <path d="M 28 78 L 80 78 L 83 84 L 25 84 Z" fill="#182232" stroke="#00E5FF" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Metronome Housing Outer -->
  <path d="M 43 23 L 65 23 L 78 79 L 30 79 Z" fill="url(#bodyGrad)"/>

  <!-- Metronome Housing Inner Cutout -->
  <path d="M 45 26 L 63 26 L 75 76 L 33 76 Z" fill="#0A0E17" stroke="#334155" stroke-width="1.2"/>

  <!-- Scale Ticks -->
  <path d="M 48 38 L 60 38 M 46 48 L 62 48 M 44 58 L 64 58 M 42 68 L 66 68" stroke="#475569" stroke-width="1" stroke-linecap="round"/>

  <!-- Center Guide Line -->
  <line x1="54" y1="28" x2="54" y2="72" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Pendulum Arm with Glow -->
  <line x1="54" y1="74" x2="68" y2="32" stroke="url(#pendulumGrad)" stroke-width="3.2" stroke-linecap="round" filter="url(#neonShadow)"/>

  <!-- Pendulum Weight (Amber Accent) -->
  <polygon points="60,40 73,44 70,51 57,47" fill="url(#weightGrad)" stroke="#FFE082" stroke-width="0.8"/>

  <!-- Pivot Center Pin -->
  <circle cx="54" cy="74" r="3.5" fill="#00E5FF"/>
  <circle cx="54" cy="74" r="1.5" fill="#FFFFFF"/>

  <!-- Dynamic Sound Waves -->
  <path d="M 74 27 C 79 32, 82 39, 82 47" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" opacity="0.85" filter="url(#neonShadow)"/>
  <path d="M 80 22 C 87 29, 90 38, 90 47" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
