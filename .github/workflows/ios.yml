name: Build iOS App

# Builds the iPhone app (SwiftUI + shared Kotlin Multiplatform framework), runs the shared
# logic tests on the iOS simulator, and publishes an unsigned .ipa as a workflow artifact.
# Runs whenever shared or iOS code changes on any branch, on pull requests, and on release tags.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'CHANGELOG.md'
      - '.github/workflows/ios.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build & Test iOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Version Info
        id: version
        run: |
          VERSION_NAME=$(grep -m1 -oE '^## \[v?[0-9]+\.[0-9]+(\.[0-9]+)?\]' CHANGELOG.md | sed -E 's/^## \[v?([0-9.]+)\]/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          fi
          VERSION_NAME=${VERSION_NAME:-1.5.0}
          IFS='.' read -r V_MAJOR V_MINOR V_PATCH <<< "${VERSION_NAME}"
          VERSION_CODE=$(( ${V_MAJOR:-1} * 10000 + ${V_MINOR:-0} * 100 + ${V_PATCH:-0} ))
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=Anchor-v${VERSION_NAME}-unsigned.ipa" >> "$GITHUB_OUTPUT"
          echo "Building Anchor iOS ${VERSION_NAME} (${VERSION_CODE})"

      # -----------------------------------------------------------------------
      # Shared Kotlin Multiplatform logic tests on the iOS simulator (Kotlin/Native)
      # -----------------------------------------------------------------------
      - name: Run Shared Logic Tests (iOS Simulator)
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: iosApp
        run: xcodegen generate

      # -----------------------------------------------------------------------
      # Simulator build (compile check)
      # -----------------------------------------------------------------------
      - name: Build for iOS Simulator
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project Anchor.xcodeproj \
            -scheme Anchor \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version_code }}"

      # -----------------------------------------------------------------------
      # Unsigned device build packaged as .ipa (re-sign with your own certificate
      # or a sideloading tool to install on an iPhone)
      # -----------------------------------------------------------------------
      - name: Build Unsigned iPhone Release
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project Anchor.xcodeproj \
            -scheme Anchor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.version.outputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version_code }}"

      - name: Package IPA and Generate SHA-256 Checksum
        run: |
          set -e
          APP_PATH="iosApp/build/device/Build/Products/Release-iphoneos/Anchor.app"
          IPA_NAME="${{ steps.version.outputs.ipa_name }}"
          test -d "${APP_PATH}"
          mkdir -p release-artifacts/Payload
          cp -R "${APP_PATH}" release-artifacts/Payload/
          (cd release-artifacts && zip -qry "${IPA_NAME}" Payload && rm -rf Payload)
          (cd release-artifacts && shasum -a 256 "${IPA_NAME}" > "${IPA_NAME}.sha256")
          cat "release-artifacts/${IPA_NAME}.sha256"
          ls -la release-artifacts/

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.ipa_name }}
          path: |
            release-artifacts/*.ipa
            release-artifacts/*.sha256
          retention-days: 14

  # ===========================================================================
  # App Store upload (v* tags only; skipped until the Apple secrets exist)
  # Required secrets:
  #   APPLE_TEAM_ID                     Apple Developer team ID
  #   APPLE_DIST_CERT_P12_BASE64        Apple Distribution certificate (.p12, base64)
  #   APPLE_DIST_CERT_PASSWORD          password of the .p12
  #   APPLE_PROVISIONING_PROFILE_BASE64 App Store provisioning profile for com.damiongans.anchor
  #   ASC_KEY_ID / ASC_ISSUER_ID        App Store Connect API key ID and issuer ID
  #   ASC_KEY_P8                        App Store Connect API private key (.p8 contents)
  # Builds with ANCHOR_DISTRIBUTION=APP_STORE (no GitHub update checker) and uploads to
  # App Store Connect / TestFlight.
  # ===========================================================================
  appstore:
    name: Upload to App Store Connect
    needs: [build-ios]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - name: Check App Store Secrets
        id: secrets
        env:
          HAS_CERT: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 != '' }}
          HAS_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
        run: |
          if [ -n "${APPLE_TEAM_ID}" ] && [ -n "${ASC_KEY_ID}" ] && [ -n "${ASC_ISSUER_ID}" ] \
             && [ "${HAS_CERT}" = "true" ] && [ "${HAS_PROFILE}" = "true" ] && [ "${HAS_KEY}" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "App Store secrets are not configured; skipping upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Select Xcode
        if: steps.secrets.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up JDK 17
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.secrets.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Install Signing Certificate & Provisioning Profile
        if: steps.secrets.outputs.ready == 'true'
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/anchor-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "profile_name=${PROFILE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare Version Info
        if: steps.secrets.outputs.ready == 'true'
        id: version
        run: |
          VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          IFS='.' read -r V_MAJOR V_MINOR V_PATCH <<< "${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=$(( ${V_MAJOR:-1} * 10000 + ${V_MINOR:-0} * 100 + ${V_PATCH:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode Project
        if: steps.secrets.outputs.ready == 'true'
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive App Store Build
        if: steps.secrets.outputs.ready == 'true'
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Anchor.xcodeproj \
            -scheme Anchor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Anchor.xcarchive \
            ANCHOR_DISTRIBUTION=APP_STORE \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
            MARKETING_VERSION="${{ steps.version.outputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version_code }}"

      - name: Export IPA
        if: steps.secrets.outputs.ready == 'true'
        working-directory: iosApp
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.damiongans.anchor</key><string>${{ steps.signing.outputs.profile_name }}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Anchor.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export
          ls -la build/export

      - name: Upload to App Store Connect
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            -f iosApp/build/export/Anchor.ipa \
            -t ios \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"
