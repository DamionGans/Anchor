name: Build iOS App

# Builds the iPhone app (SwiftUI + shared Kotlin Multiplatform framework), runs the shared
# logic tests on the iOS simulator, and publishes an unsigned .ipa as a workflow artifact.
# Runs whenever shared or iOS code changes on any branch, on pull requests, and on release tags.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'CHANGELOG.md'
      - '.github/workflows/ios.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build & Test iOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Version Info
        id: version
        run: |
          VERSION_NAME=$(grep -m1 -oE '^## \[v?[0-9]+\.[0-9]+(\.[0-9]+)?\]' CHANGELOG.md | sed -E 's/^## \[v?([0-9.]+)\]/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          fi
          VERSION_NAME=${VERSION_NAME:-1.4.0}
          IFS='.' read -r V_MAJOR V_MINOR V_PATCH <<< "${VERSION_NAME}"
          VERSION_CODE=$(( ${V_MAJOR:-1} * 10000 + ${V_MINOR:-0} * 100 + ${V_PATCH:-0} ))
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=Anchor-v${VERSION_NAME}-unsigned.ipa" >> "$GITHUB_OUTPUT"
          echo "Building Anchor iOS ${VERSION_NAME} (${VERSION_CODE})"

      # -----------------------------------------------------------------------
      # Shared Kotlin Multiplatform logic tests on the iOS simulator (Kotlin/Native)
      # -----------------------------------------------------------------------
      - name: Run Shared Logic Tests (iOS Simulator)
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: iosApp
        run: xcodegen generate

      # -----------------------------------------------------------------------
      # Simulator build (compile check)
      # -----------------------------------------------------------------------
      - name: Build for iOS Simulator
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project Anchor.xcodeproj \
            -scheme Anchor \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version_code }}"

      # -----------------------------------------------------------------------
      # Unsigned device build packaged as .ipa (re-sign with your own certificate
      # or a sideloading tool to install on an iPhone)
      # -----------------------------------------------------------------------
      - name: Build Unsigned iPhone Release
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project Anchor.xcodeproj \
            -scheme Anchor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.version.outputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version_code }}"

      - name: Package IPA and Generate SHA-256 Checksum
        run: |
          set -e
          APP_PATH="iosApp/build/device/Build/Products/Release-iphoneos/Anchor.app"
          IPA_NAME="${{ steps.version.outputs.ipa_name }}"
          test -d "${APP_PATH}"
          mkdir -p release-artifacts/Payload
          cp -R "${APP_PATH}" release-artifacts/Payload/
          (cd release-artifacts && zip -qry "${IPA_NAME}" Payload && rm -rf Payload)
          (cd release-artifacts && shasum -a 256 "${IPA_NAME}" > "${IPA_NAME}.sha256")
          cat "release-artifacts/${IPA_NAME}.sha256"
          ls -la release-artifacts/

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.ipa_name }}
          path: |
            release-artifacts/*.ipa
            release-artifacts/*.sha256
          retention-days: 14
