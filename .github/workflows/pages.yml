name: Deploy Website

# Publishes the GitHub Pages site from website/ (Settings -> Pages -> Source: GitHub Actions).
# Independent of the Android and iOS build workflows: runs when the website, CHANGELOG.md
# (release version), or this workflow changes on main, on v* tags, or manually.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'website/**'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy GitHub Pages Website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sync Website with Latest App Release Metadata
        env:
          # Tag pushes deploy that tag's version; main pushes use the top CHANGELOG.md entry
          # (the same version the Android workflow publishes as the GitHub Release).
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          python3 - << 'EOF'
          import json, os, re, datetime

          # Version from the v* tag, otherwise the top CHANGELOG.md entry
          ver = os.environ.get("VERSION_NAME", "")
          tag = os.environ.get("RELEASE_TAG", "")
          if tag and not ver:
              ver = tag.lstrip("vV")
          apk_name = os.environ.get("APK_NAME", "")

          if not ver:
              if os.path.exists("CHANGELOG.md"):
                  with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                      m = re.search(r'##\s+\[v?([0-9.]+)\]', f.read())
                      if m:
                          ver = m.group(1)
              ver = ver or "1.2.3"

          if not tag:
              tag = f"v{ver}"
          if not apk_name:
              apk_name = f"Anchor-{tag}.apk"

          today = datetime.datetime.now(datetime.timezone.utc).strftime("%B %d, %Y")
          repo = os.environ.get("GITHUB_REPOSITORY", "DamionGans/Anchor")
          download_url = f"https://github.com/{repo}/releases/download/{tag}/{apk_name}"

          # Update website/version.json
          ver_path = "website/version.json"
          if os.path.exists(ver_path):
              with open(ver_path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              data["version"] = ver
              data["releaseTag"] = tag
              data["releaseDate"] = today
              data["apkName"] = apk_name
              data["downloadUrl"] = download_url
              with open(ver_path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)
              print(f"Updated {ver_path} with {tag}")

          # Update website/index.html
          html_path = "website/index.html"
          if os.path.exists(html_path):
              with open(html_path, "r", encoding="utf-8") as f:
                  html = f.read()
              html = re.sub(r'class="brand-tag">v[0-9.]+<', f'class="brand-tag">{tag}<', html)
              html = re.sub(r'id="version-pill-text"[^>]*>v[0-9.]+<', f'id="version-pill-text" class="pill-version-name">{tag}<', html)
              html = re.sub(r'Download for Android \(v[0-9.]+\)', f'Download for Android ({tag})', html)
              html = re.sub(r'/releases/download/[^/]+/[^"]+\.apk', f'/releases/download/{tag}/{apk_name}', html)
              with open(html_path, "w", encoding="utf-8") as f:
                  f.write(html)
              print(f"Updated {html_path} with {tag} links")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'website/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
