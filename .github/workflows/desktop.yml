name: Windows App (x64 + arm64)

# Builds, tests, and packages the Windows app on real Windows machines for both CPU
# architectures: shared + desktop tests, then one MSI per architecture (jpackage cannot
# cross-build, so each MSI is built on a matching runner). On main and v* tags, the MSIs are
# attached to the GitHub Release that android.yml creates for the same version.
# Store uploads (Microsoft Store) are not part of this workflow.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }} (test + MSI)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            java-arch: x64
          - arch: arm64
            runner: windows-11-arm
            java-arch: aarch64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21 (${{ matrix.java-arch }})
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          architecture: ${{ matrix.java-arch }}

      # The shared modules also declare the Android target, which needs an Android SDK to
      # configure (nothing Android is compiled by this workflow).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the removed `tools` package; only a valid
          # SDK root is needed here.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        run: |
          # Same rule as android.yml: v* tags use the tag, everything else the top CHANGELOG entry.
          CHANGELOG_VER=$(grep -m1 -oE '^## \[v?[0-9]+\.[0-9]+(\.[0-9]+)?\]' CHANGELOG.md | sed -E 's/^## \[v?([0-9.]+)\]/\1/' || true)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="v${CHANGELOG_VER:-1.6.1}"
          fi
          VERSION_NAME="${RELEASE_TAG#v}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "msi_name=Anchor-${RELEASE_TAG}-windows-${{ matrix.arch }}.msi" >> "$GITHUB_OUTPUT"
          java -version
          java -XshowSettings:properties -version 2>&1 | grep -E "os.name|os.arch"

      - name: Run shared desktop tests
        run: ./gradlew :shared:desktopTest --stacktrace

      - name: Build MSI
        run: ./gradlew :desktopApp:packageMsi -PversionName="${{ steps.version.outputs.version_name }}" --stacktrace

      - name: Stage MSI and SHA-256 checksum
        run: |
          mkdir -p release-artifacts
          MSI_SRC=$(ls desktopApp/build/compose/binaries/main/msi/*.msi | head -n 1)
          MSI_NAME="${{ steps.version.outputs.msi_name }}"
          cp "$MSI_SRC" "release-artifacts/${MSI_NAME}"
          (cd release-artifacts && sha256sum "${MSI_NAME}" > "${MSI_NAME}.sha256")
          ls -la release-artifacts
          cat "release-artifacts/${MSI_NAME}.sha256"

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: anchor-windows-${{ matrix.arch }}
          path: release-artifacts/
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-reports-${{ matrix.arch }}
          path: shared/build/reports/tests/desktopTest/
          retention-days: 7

  # Attach both MSIs to the GitHub Release of this version (created by android.yml).
  release:
    name: Attach MSIs to GitHub Release
    needs: [windows]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Download MSIs
        uses: actions/download-artifact@v8
        with:
          pattern: anchor-windows-*
          merge-multiple: true
          path: release-artifacts

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ls -la release-artifacts
          MSI=$(ls release-artifacts/*.msi | head -n 1)
          RELEASE_TAG=$(basename "$MSI" | sed -E 's/^Anchor-(v[0-9.]+)-windows-.*$/\1/')
          # android.yml creates the release; wait for it (up to ~40 minutes).
          for i in $(seq 1 80); do
            if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for GitHub Release ${RELEASE_TAG} (attempt ${i})..."
            sleep 30
          done
          gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null
          gh release upload "$RELEASE_TAG" release-artifacts/*.msi release-artifacts/*.sha256 --repo "$REPO" --clobber
